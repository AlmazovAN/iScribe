name: CI
run-name: CI / ${{ inputs.request_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional unique request ID for PowerShell V6'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  browser-acceptance:
    # Pinned Playwright 1.56.1 does not support the ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E2E runner intentionally has no production or lockfile dependency.
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # The offline browser suite exercises both distribution formats.
      - run: npm run build
      - run: npm run build:web
      - run: npm run release:check:web
      - run: npx playwright test --config playwright.offline.config.mjs
  build:
    needs: [verify, browser-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
